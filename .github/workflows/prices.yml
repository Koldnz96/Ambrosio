# Reads supermarket prices once a day and saves them in prices/prices.json (in this repo).
# Ambrósio reads that file. You can also start it by hand: GitHub > Actions > Daily prices > Run workflow.
name: Daily prices

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC (quiet hours for the shops)
  workflow_dispatch: # the "Run workflow" button

permissions:
  contents: write # needed to save prices/prices.json back into the repo

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Product lists (sitemaps)
        run: |
          node scripts/prices/get-continente-list.mjs
          node scripts/prices/check-shops.mjs
      - name: Match products to our ingredients
        run: node scripts/prices/build-matches.mjs
      - name: Read prices
        run: node scripts/prices/fetch-prices.mjs
      - name: Save prices/prices.json
        run: |
          git config user.name "ambrosio-prices-bot"
          git config user.email "ambrosio.app.pt@gmail.com"
          git add prices/prices.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily prices $(date -u +%F)"
          git pull --rebase origin main
          git push